server {
  listen 80;
  server_name localhost;

  # 1. Servir os arquivos estáticos do React
  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    
    # 2. Configuração de SPA (para o React Router)
    # Se um arquivo/diretório não for encontrado, serve o index.html
    try_files $uri $uri/ /index.html;
  }

  # 3. Proxy Reverso para a API (Backend Go)
  # Qualquer requisição que comece com /api/...
  location /api/ {
    # Será repassada para o serviço 'backend' na porta 8080
    # 'backend' é o nome do serviço no docker-compose.yml
    proxy_pass http://backend:8080/api/;
    
    # Cabeçalhos importantes para o proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}