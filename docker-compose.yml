
services:
  # 1. Serviço da API em Go (Backend)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Passa a URL do banco de dados para a API
      # Note que o 'host' é 'db', o nome do serviço do Postgres
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    
    # --- MUDANÇA 2 ---
    # Boa prática: Se o backend falhar por qualquer outro motivo, ele tenta reiniciar.
    restart: on-failure 
    networks:
      - orcamento-net

  # 2. Serviço do Frontend (React + Nginx Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend # Este depends_on simples está ok
    
    # --- MUDANÇA 3 ---
    # Boa prática: Reinicia o Nginx se ele falhar.
    restart: on-failure
    networks:
      - orcamento-net

  # 3. Serviço do Banco de Dados PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]      
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orcamento-net

# Define a rede customizada
networks:
  orcamento-net:
    driver: bridge

# Define o volume nomeado para persistir os dados do banco
volumes:
  postgres_data: